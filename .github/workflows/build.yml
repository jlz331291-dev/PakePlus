name: SecurePass Portable Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Regenerate icons
        run: pnpm tauri icon

      - name: Build portable exe (no bundle)
        run: pnpm tauri build --no-bundle

      - name: Upload portable exe to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="SecurePass-v${VERSION}"
          RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name==\"${TAG}\" and .draft==true) | .id" | head -n 1)"
          if [ -z "${RELEASE_ID}" ]; then
            echo "::warning::未找到草稿发布 ${TAG}，跳过便携版 exe 上传。"
            exit 0
          fi
          if [ ! -f "src-tauri/target/release/securepass.exe" ]; then
            echo "::error::未找到 src-tauri/target/release/securepass.exe"
            exit 1
          fi
          curl -sL -X POST \
            -H "Content-Type: application/octet-stream" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            --data-binary "@src-tauri/target/release/securepass.exe" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=SecurePass_${VERSION}_x64-portable.exe"
