<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#3B82F6" stroke-width="4"/>

  <!-- 盾牌外框 -->
  <path d="M256 60 L400 120 L400 260 C400 360 320 440 256 460 C192 440 112 360 112 260 L112 120 Z"
        fill="url(#shield)" opacity="0.15"/>

  <!-- 盾牌主体 -->
  <path d="M256 80 L380 135 L380 260 C380 350 310 420 256 438 C202 420 132 350 132 260 L132 135 Z"
        fill="url(#shield)"/>

  <!-- 盾牌内边框 -->
  <path d="M256 90 L368 142 L368 260 C368 342 304 408 256 424 C208 408 144 342 144 260 L144 142 Z"
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- 钥匙图标 -->
  <g transform="translate(256, 260)">
    <!-- 钥匙柄（圆） -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#key)" stroke-width="8"/>
    <circle cx="0" cy="0" r="15" fill="#3B82F6" stroke="url(#key)" stroke-width="3"/>

    <!-- 钥匙杆 -->
    <rect x="-6" y="35" width="12" height="75" rx="4" fill="url(#key)"/>
    <rect x="-16" y="92" width="12" height="18" rx="3" fill="url(#key)"/>
    <rect x="4" y="82" width="12" height="18" rx="3" fill="url(#key)"/>
  </g>

  <!-- 顶部锁孔装饰 -->
  <circle cx="256" cy="140" r="12" fill="rgba(255,255,255,0.3)"/>
  <rect x="250" y="140" width="12" height="22" rx="2" fill="rgba(255,255,255,0.3)"/>
</svg>
